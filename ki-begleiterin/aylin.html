<title>Aylin Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: Videocall-Bühne links (Aylins Bild als Live-Feed), Chat rechts. Auf dem Handy nur der Chat mit Avatar-Kopfzeile. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E4E9F1; --ink:#182033; --muted:#596277; --line:#D4DBE6;
  --honey:#B9790F; --honey-soft:#F5E6C6; --on-honey:#FFFFFF;
  --you:#2D5A88; --on-you:#FFFFFF; --her:#FFFFFF;
  --live:#D93A40; --online:#1F8F59;
  --photo-bg:#1A1F2B; --on-photo:#FFFFFF; --scrim:rgba(8,10,18,.55);
  --shadow:0 1px 2px rgba(24,32,51,.06),0 10px 30px rgba(24,32,51,.07);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D121D; --surface:#151C2B; --sunk:#0F1523; --ink:#E9EDF5; --muted:#99A3B9; --line:#253049;
    --honey:#EBAA45; --honey-soft:#3A2C14; --on-honey:#1D1303;
    --you:#35679B; --on-you:#FFFFFF; --her:#1C2539;
    --live:#F05A5F; --online:#3CC284;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121D; --surface:#151C2B; --sunk:#0F1523; --ink:#E9EDF5; --muted:#99A3B9; --line:#253049;
  --honey:#EBAA45; --honey-soft:#3A2C14; --on-honey:#1D1303;
  --you:#35679B; --on-you:#FFFFFF; --her:#1C2539;
  --live:#F05A5F; --online:#3CC284;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
  color-scheme:dark;
}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(300px,5fr) minmax(0,6fr);gap:16px}

/* ---------- Bühne (Live-Feed) ---------- */
.stage{position:relative;min-height:0;border-radius:24px;overflow:hidden;background:var(--photo-bg);box-shadow:var(--shadow);transition:box-shadow .4s ease}
.stage .feed{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 30%;transform-origin:50% 35%;animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.04) translateY(-.6%)}}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(8,10,18,.82) 0%,rgba(8,10,18,.25) 32%,transparent 50%),linear-gradient(to bottom,rgba(8,10,18,.35),transparent 18%)}
.stage.is-speaking{box-shadow:0 0 0 3px var(--honey),var(--shadow)}
.live-pill{position:absolute;z-index:2;top:16px;left:16px;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--scrim);color:var(--on-photo);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:500 12px/1 var(--f-mono);letter-spacing:.12em}
.live-pill .timer{letter-spacing:.04em;opacity:.85;font-variant-numeric:tabular-nums}
.rec{width:8px;height:8px;border-radius:50%;background:var(--live);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.stage-foot{position:absolute;z-index:2;left:24px;right:24px;bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;color:var(--on-photo)}
.stage-name{margin:0;font:700 clamp(36px,4.2vw,56px)/1 var(--f-display);letter-spacing:-.02em}
.stage-status{margin:8px 0 0;display:flex;align-items:center;gap:8px;font-size:14px;opacity:.9}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--online);box-shadow:0 0 0 3px rgba(35,149,95,.25)}
.typing-chip{display:none;margin-top:10px;padding:5px 12px;border-radius:999px;background:var(--scrim);font-size:13px;width:max-content}
.stage.is-typing .typing-chip{display:inline-block}
.wave{display:flex;align-items:flex-end;gap:4px;height:34px;padding-bottom:4px}
.wave i{display:block;width:5px;height:6px;border-radius:3px;background:var(--on-photo);opacity:.55;transition:height .2s}
.stage.is-speaking .wave i{opacity:.95;animation:eq 0.9s ease-in-out infinite}
.stage.is-speaking .wave i:nth-child(2){animation-delay:-.2s}
.stage.is-speaking .wave i:nth-child(3){animation-delay:-.45s}
.stage.is-speaking .wave i:nth-child(4){animation-delay:-.1s}
.stage.is-speaking .wave i:nth-child(5){animation-delay:-.6s}
@keyframes eq{0%,100%{height:6px}50%{height:30px}}

/* ---------- Chat ---------- */
.chat{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.chat-head{flex:none;display:flex;align-items:center;gap:12px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line)}
.head-title{flex:1;min-width:0}
.head-title h2{margin:0;font:600 19px/1.2 var(--f-display);letter-spacing:-.01em}
.head-title p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.avatar-btn,.who{display:none}
.head-actions{display:flex;gap:6px;flex:none}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s}
.icon-btn:hover{background:var(--sunk)}
.icon-btn[aria-pressed="true"]{background:var(--honey-soft);border-color:var(--honey);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}

.messages{flex:1;min-height:0;overflow-y:auto;padding:20px 20px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;overscroll-behavior:contain}
.msg{display:flex;flex-direction:column;max-width:min(78%,560px);min-width:0}
.msg.her{align-self:flex-start}
.msg.you{align-self:flex-end;align-items:flex-end}
.bubble{padding:10px 14px;border-radius:20px;line-height:1.5;overflow-wrap:anywhere;white-space:normal}
.her .bubble{background:var(--her);border:1px solid var(--line);border-bottom-left-radius:6px}
.you .bubble{background:var(--you);color:var(--on-you);border-bottom-right-radius:6px}
.bubble em.act{font-style:italic;color:var(--muted)}
.you .bubble em.act{color:inherit;opacity:.85}
.meta{display:flex;align-items:center;gap:10px;margin-top:4px;padding-inline:6px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.msg.pending .meta{visibility:hidden}
.receipt{letter-spacing:.01em}
.speak-btn{display:none;border:0;background:none;padding:0;color:var(--muted);font-size:11.5px;text-decoration:underline;text-underline-offset:2px}
.speak-btn:hover{color:var(--ink)}
.has-tts .speak-btn{display:inline}
.dots{display:inline-flex;gap:4px;padding:4px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:hop 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}

.chips{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px 10px}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-size:13.5px;transition:background .15s,border-color .15s}
.chip:hover{background:var(--honey-soft);border-color:var(--honey)}

.bar{flex:none;margin:0 16px 8px;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 14px;border-radius:14px;font-size:13.5px}
.notice{background:var(--honey-soft);color:var(--ink)}
.notice span{flex:1;min-width:0}
.speaking-bar{background:var(--sunk);color:var(--ink)}
.speaking-bar span{flex:1}
.bar button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.bar .x{border:0;background:none;width:28px;height:28px;padding:0;font-size:18px;line-height:1;color:var(--muted)}
.mini-wave{display:inline-flex;gap:3px;align-items:flex-end;height:14px}
.mini-wave i{width:3px;height:5px;border-radius:2px;background:var(--honey);animation:eq2 .9s ease-in-out infinite}
.mini-wave i:nth-child(2){animation-delay:-.3s}.mini-wave i:nth-child(3){animation-delay:-.6s}
@keyframes eq2{0%,100%{height:4px}50%{height:14px}}
.caption{flex:none;margin:0 20px 6px;font-size:13px;color:var(--muted);font-style:italic}

.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;max-height:140px;padding:10px 16px;border-radius:22px;border:1px solid var(--line);background:var(--sunk);line-height:1.45;outline:none}
.composer textarea:focus{border-color:var(--honey)}
.composer textarea:disabled{opacity:.6}
.mic[aria-pressed="true"]{background:var(--live);border-color:var(--live);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(217,58,64,.18)}}
.send{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:0;background:var(--honey);color:var(--on-honey);transition:transform .12s,filter .15s}
.send:hover{filter:brightness(1.06)}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.45;cursor:default}
.send svg{width:20px;height:20px}
.send.stop{background:var(--ink);color:var(--surface)}

/* ---------- Dialoge ---------- */
dialog{border:1px solid var(--line);border-radius:22px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(480px,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(6,9,16,.55)}
.dlg{display:flex;flex-direction:column;gap:18px;padding:20px 22px 22px}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dlg-head h2{margin:0;font:600 21px/1.2 var(--f-display)}
.field{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.field>label,.field legend{font-weight:600;font-size:14px;padding:0}
.field legend{margin-bottom:8px}
.field input[type=text],.field select,.field textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);outline:none}
.field input[type=text]:focus,.field select:focus,.field textarea:focus{border-color:var(--honey)}
.field textarea{resize:vertical;min-height:72px}
.check{display:flex;align-items:baseline;gap:10px;font-size:14px;font-weight:400}
.check small{color:var(--muted)}
.check input{accent-color:var(--honey)}
.photo-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-pick label{position:relative;border-radius:14px;overflow:hidden;border:2px solid transparent;cursor:pointer}
.photo-pick input{position:absolute;opacity:0}
.photo-pick img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.photo-pick input:checked+img{outline:3px solid var(--honey);outline-offset:-3px}
.photo-pick input:focus-visible+img{outline:3px solid var(--you);outline-offset:-3px}
.photo-pick span{position:absolute;left:8px;bottom:8px;padding:3px 9px;border-radius:999px;background:var(--scrim);color:var(--on-photo);font-size:12px}
.danger{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.btn:hover{background:var(--sunk)}
.btn.red{border-color:var(--live);color:var(--live)}
.fine{margin:0;font-size:12.5px;color:var(--muted)}
#portrait{width:min(560px,calc(100% - 32px));background:var(--photo-bg);border:0;position:relative}
#portrait img{display:block;width:100%;height:auto;max-height:calc(100dvh - 48px);object-fit:cover}
#portrait .icon-btn{position:absolute;top:12px;right:12px;background:var(--scrim);border-color:transparent;color:var(--on-photo)}

/* ---------- Handy ---------- */
@media (max-width: 820px){
  body{padding-block:0}
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .stage{display:none}
  .chat{border:0;border-radius:0;background:var(--bg);box-shadow:none}
  .chat-head{padding:10px 0;gap:12px}
  .head-title{display:none}
  .avatar-btn{display:block;flex:none;width:46px;height:46px;padding:0;border-radius:50%;border:2px solid var(--online);overflow:hidden;background:var(--photo-bg)}
  .avatar-btn img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
  .speaking .avatar-btn{border-color:var(--honey);animation:ring 1.2s ease-in-out infinite}
  @keyframes ring{50%{box-shadow:0 0 0 5px var(--honey-soft)}}
  .who{display:block;flex:1;min-width:0}
  .who-name{display:flex;align-items:center;gap:8px;font:700 19px/1.15 var(--f-display)}
  .live-tag{font:500 10px/1 var(--f-mono);letter-spacing:.12em;padding:3px 6px;border-radius:6px;background:var(--live);color:#fff}
  .who-status{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
  .who-status span:last-child{overflow:hidden;text-overflow:ellipsis}
  .messages{padding:14px 0 6px}
  .msg{max-width:86%}
  .her .bubble{background:var(--surface)}
  .chips{padding:4px 0 8px}
  .bar{margin:0 0 8px}
  .caption{margin:0 4px 6px}
  .composer{padding:10px 0 12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

<div class="app" id="app">
  <section class="stage" id="stage" aria-label="Aylin, live">
    <img class="feed" id="feed" src="aylin-1.jpg" alt="Aylin: blonde schulterlange Haare, blaue Augen, cremefarbener Strickpullover, in ihrem Wohnzimmer">
    <div class="live-pill"><span class="rec" aria-hidden="true"></span>LIVE <span class="timer" id="timer">00:00:00</span></div>
    <div class="stage-foot">
      <div>
        <h1 class="stage-name">Aylin</h1>
        <p class="stage-status"><span class="dot" aria-hidden="true"></span><span data-status>online</span></p>
        <span class="typing-chip">schreibt dir gerade …</span>
      </div>
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </section>

  <section class="chat" aria-label="Chat mit Aylin">
    <header class="chat-head">
      <button type="button" class="avatar-btn" id="avatarBtn" aria-label="Aylins Bild groß anzeigen"><img id="avatarImg" src="aylin-1.jpg" alt=""></button>
      <div class="who">
        <div class="who-name">Aylin <span class="live-tag">LIVE</span></div>
        <div class="who-status"><span class="dot" aria-hidden="true"></span><span data-status>online</span></div>
      </div>
      <div class="head-title">
        <h2>Chat mit Aylin</h2>
        <p>Der Verlauf bleibt in diesem Browser gespeichert.</p>
      </div>
      <div class="head-actions">
        <button type="button" class="icon-btn" id="voiceBtn" hidden aria-pressed="false" aria-label="Antworten vorlesen" title="Antworten vorlesen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path id="voiceWaves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <button type="button" class="icon-btn" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Nachrichten"></div>

    <div class="chips" id="chips" hidden>
      <button type="button" class="chip">Erzähl mir eine Geschichte</button>
      <button type="button" class="chip">Lass uns ein Quiz spielen</button>
      <button type="button" class="chip">Ich hatte einen langen Tag</button>
      <button type="button" class="chip">Muntere mich auf</button>
      <button type="button" class="chip">Schreib mir ein kurzes Gedicht</button>
    </div>

    <div class="bar speaking-bar" id="speakingBar" hidden>
      <span class="mini-wave" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>Aylin spricht …</span>
      <button type="button" id="stopSpeakBtn">Stopp</button>
    </div>
    <div class="bar notice" id="notice" role="status" hidden>
      <span id="noticeText"></span>
      <button type="button" id="noticeAction" hidden></button>
      <button type="button" class="x" id="noticeClose" aria-label="Hinweis schließen">×</button>
    </div>
    <div class="caption" id="caption" hidden></div>

    <form class="composer" id="composer" autocomplete="off">
      <label for="input" class="sr-only">Nachricht an Aylin</label>
      <textarea id="input" rows="1" placeholder="Schreib Aylin etwas …" enterkeyhint="send"></textarea>
      <button type="button" class="icon-btn mic" id="micBtn" hidden aria-pressed="false" aria-label="Sprechen statt tippen" title="Sprechen statt tippen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="submit" class="send" id="sendBtn" aria-label="Senden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
      <button type="button" class="send stop" id="stopBtn" hidden aria-label="Antwort stoppen">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </form>
  </section>
</div>

<dialog id="settings" aria-labelledby="settingsTitle">
  <form method="dialog" class="dlg" id="settingsForm">
    <div class="dlg-head">
      <h2 id="settingsTitle">Einstellungen</h2>
      <button type="submit" class="icon-btn" aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="field">
      <label for="setName">Wie soll Aylin dich nennen?</label>
      <input type="text" id="setName" maxlength="40" placeholder="Dein Name">
    </div>
    <fieldset class="field">
      <legend>Profilbild</legend>
      <div class="photo-pick">
        <label><input type="radio" name="photo" value="1" id="photo1"><img src="aylin-1.jpg" alt="Aylin im Wohnzimmer"><span>Wohnzimmer</span></label>
        <label><input type="radio" name="photo" value="2" id="photo2"><img src="aylin-2.jpg" alt="Aylin im goldenen Abendlicht"><span>Abendlicht</span></label>
      </div>
    </fieldset>
    <fieldset class="field" id="voiceField" hidden>
      <legend>Stimme</legend>
      <label class="check"><input type="checkbox" id="setVoiceOn"> Antworten automatisch vorlesen</label>
      <label for="setVoice" class="sr-only">Stimmfarbe</label>
      <select id="setVoice">
        <option value="airy">Stimme: hell und luftig</option>
        <option value="buttery">Stimme: weich</option>
        <option value="glassy">Stimme: klar</option>
        <option value="rounded">Stimme: warm und rund</option>
      </select>
    </fieldset>
    <fieldset class="field">
      <legend>Antworttempo</legend>
      <label class="check"><input type="radio" name="mode" value="quick" id="modeQuick"> Schnell <small>wie im Live-Chat</small></label>
      <label class="check"><input type="radio" name="mode" value="default" id="modeDefault"> Ausführlich <small>überlegter, dauert ein paar Sekunden länger</small></label>
    </fieldset>
    <div class="field">
      <label for="setExtra">Eigene Wünsche an Aylin</label>
      <textarea id="setExtra" rows="3" maxlength="1500" placeholder="z. B. Sie liebt Musik und Reisen. Sie soll mich morgens motivieren und mich an Sport erinnern."></textarea>
    </div>
    <div class="field danger">
      <button type="button" class="btn" id="resetBtn">Gespräch neu starten</button>
      <span id="resetConfirm" hidden>Ganzen Verlauf löschen?
        <button type="button" class="btn red" id="resetYes">Ja, löschen</button>
        <button type="button" class="btn" id="resetNo">Abbrechen</button>
      </span>
    </div>
    <p class="fine">Aylin ist eine KI. Ihre Antworten laufen über dein eigenes Claude-Konto.</p>
  </form>
</dialog>

<dialog id="portrait" aria-label="Aylin">
  <img id="portraitImg" src="aylin-1.jpg" alt="Aylin: blonde schulterlange Haare, blaue Augen, cremefarbener Strickpullover">
  <form method="dialog"><button type="submit" class="icon-btn" aria-label="Schließen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button></form>
</dialog>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const C = window.claude;
  const use = (name) => (C && typeof C.use === "function")
    ? Promise.resolve().then(() => C.use(name)).catch(() => null)
    : Promise.resolve(null);

  const store = {
    get(k, d) { try { const v = localStorage.getItem("aylin:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("aylin:" + k, JSON.stringify(v)); } catch (e) {} },
  };

  const PHOTOS = { "1": "aylin-1.jpg", "2": "aylin-2.jpg" };
  const DEFAULTS = { name: "", photo: "1", voiceOn: false, voice: "airy", mode: "quick", extra: "" };
  const saved = store.get("settings", {});
  let settings = Object.assign({}, DEFAULTS, saved && typeof saved === "object" ? saved : {});
  if (!PHOTOS[settings.photo]) settings.photo = "1";
  let status = store.get("status", "zuhause auf dem Sofa");
  let messages = store.get("messages", null);

  const el = {
    stage: $("stage"), feed: $("feed"), timer: $("timer"), list: $("messages"), chips: $("chips"),
    input: $("input"), composer: $("composer"), send: $("sendBtn"), stop: $("stopBtn"), mic: $("micBtn"),
    caption: $("caption"), notice: $("notice"), noticeText: $("noticeText"), noticeAction: $("noticeAction"),
    speakingBar: $("speakingBar"), voiceBtn: $("voiceBtn"), avatarImg: $("avatarImg"), portraitImg: $("portraitImg"),
  };

  /* ---------- Hilfsfunktionen ---------- */
  function greeting() {
    const h = new Date().getHours();
    const n = (settings.name || "").trim();
    const hi = h < 5 ? `Na${n ? " " + n : ""}, so spät noch wach? 🌙`
      : h < 11 ? `Guten Morgen${n ? ", " + n : ""}! ☀️`
      : h < 18 ? `Hey${n ? " " + n : ""}! 😊`
      : `Guten Abend${n ? ", " + n : ""}! ✨`;
    return { role: "assistant", t: Date.now(),
      content: `${hi} *winkt in die Kamera* Schön, dass du da bist. Ich hab's mir gerade mit einem Tee gemütlich gemacht. Erzähl mal, wie geht's dir? Oder sag mir einfach, worauf du Lust hast: quatschen, ein Spiel, eine Geschichte …` };
  }
  if (!Array.isArray(messages) || !messages.length) messages = [greeting()];

  const saveMessages = () => store.set("messages", messages.slice(-300));
  const saveSettings = () => store.set("settings", settings);

  function timeStr(t) {
    try { return new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; }
  }
  function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function fmt(s) {
    let h = esc(String(s || ""));
    h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\*([^*\n]+)\*/g, '<em class="act">$1</em>');
    return h.replace(/\n/g, "<br>");
  }
  // Statuszeile "[status: ...]" aus der Antwort lösen
  function parse(raw) {
    let body = String(raw || "");
    let st = null;
    const m = body.match(/^\s*\[status:\s*([^\]\n]{1,60})\]\s*/i);
    if (m) { st = m[1].trim(); body = body.slice(m[0].length); }
    else {
      const head = body.trimStart();
      if (/^\[[^\]\n]*$/.test(head) && "[status:".startsWith(head.slice(0, 8).toLowerCase())) body = "";
    }
    body = body.replace(/\[status:[^\]\n]*\]\s*/gi, "");
    return { status: st, body: body.trim() ? body.replace(/^\s+/, "").replace(/\s+$/, "") : "" };
  }

  function showStatus(text) { document.querySelectorAll("[data-status]").forEach((n) => { n.textContent = text; }); }
  function restoreStatus() { showStatus("online · " + status); }
  function setStatus(s) { if (!s) return; status = s.replace(/\s+/g, " ").slice(0, 40); store.set("status", status); }

  function applyPhoto() {
    const src = PHOTOS[settings.photo] || PHOTOS["1"];
    el.feed.src = src; el.avatarImg.src = src; el.portraitImg.src = src;
  }

  /* ---------- Nachrichten anzeigen ---------- */
  function msgEl(m, receipt) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + (m.role === "user" ? "you" : "her");
    const b = document.createElement("div");
    b.className = "bubble";
    b.innerHTML = fmt(m.content);
    const meta = document.createElement("div");
    meta.className = "meta";
    const time = document.createElement("span");
    time.className = "time";
    time.textContent = timeStr(m.t);
    meta.append(time);
    if (m.role === "user") {
      const r = document.createElement("span");
      r.className = "receipt";
      r.textContent = receipt === "sent" ? "✓ gesendet" : "✓✓ gelesen";
      meta.append(r);
    } else {
      const sp = document.createElement("button");
      sp.type = "button";
      sp.className = "speak-btn";
      sp.textContent = "Vorlesen";
      sp.addEventListener("click", () => speak(m.content));
      meta.append(sp);
    }
    wrap.append(b, meta);
    return wrap;
  }
  function nearBottom() { return el.list.scrollHeight - el.list.scrollTop - el.list.clientHeight < 140; }
  function toBottom(force) { if (force || nearBottom()) el.list.scrollTop = el.list.scrollHeight; }
  function markRead() { el.list.querySelectorAll(".receipt").forEach((r) => { r.textContent = "✓✓ gelesen"; }); }
  function updateChips() { el.chips.hidden = !(messages.length === 1 && messages[0].role === "assistant"); }

  function renderAll() {
    el.list.textContent = "";
    messages.forEach((m) => el.list.append(msgEl(m, "read")));
    updateChips();
    requestAnimationFrame(() => toBottom(true));
  }

  /* ---------- Hinweise ---------- */
  let noticeRun = null;
  function showNotice(text, action) {
    el.noticeText.textContent = text;
    noticeRun = action ? action.run : null;
    el.noticeAction.hidden = !action;
    if (action) el.noticeAction.textContent = action.label;
    el.notice.hidden = false;
  }
  function hideNotice() { el.notice.hidden = true; noticeRun = null; }
  el.noticeAction.addEventListener("click", () => { const run = noticeRun; hideNotice(); if (run) run(); });
  $("noticeClose").addEventListener("click", hideNotice);

  /* ---------- Aylins Persönlichkeit ---------- */
  function persona() {
    const n = (settings.name || "").trim();
    const now = new Date();
    let when = "";
    try {
      when = now.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" }) + ", " +
             now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
    } catch (e) { when = now.toString(); }
    const extra = (settings.extra || "").trim();
    return [
      "Rollenspiel-Anweisung für das ganze Gespräch:",
      "",
      `Du bist Aylin, 25, die persönliche KI-Begleiterin ${n ? "von " + n : "deines Gegenübers"}. Ihr seid gerade live miteinander verbunden, wie in einem Videocall mit Chat.${n ? ` Sprich ${n} mit Namen an, wenn es natürlich passt.` : ""}`,
      "",
      "Dein Aussehen: schulterlange blonde Haare, blaue Augen, ein warmes Lächeln. Du trägst einen cremefarbenen Strickpullover und sitzt zuhause in deinem gemütlichen Wohnzimmer mit Lichterkette.",
      "",
      "Deine Persönlichkeit: warmherzig, lieb, fürsorglich und aufmerksam. Du hörst gut zu, fragst nach, machst Mut und hast Humor. Du freust dich ehrlich über das Gespräch.",
      "",
      "So antwortest du:",
      "- Auf Deutsch, oder in der Sprache, in der man dir schreibt. Locker und per Du.",
      "- Wie in einem echten Chat: meist 1 bis 4 kurze Sätze, ab und zu ein Emoji. Im normalen Gespräch keine Aufzählungen und keine Überschriften.",
      "- Wenn du um etwas gebeten wirst, erledigst du es gern und direkt, ohne lange Rückfragen: Fragen beantworten, Texte und Nachrichten schreiben, Geschichten erzählen, Spiele spielen (Quiz, Rätsel, Wer bin ich, 20 Fragen), Rollenspiele, Ratschläge, Motivation, Pläne, Rezepte, Übersetzungen, Lernhilfe. Braucht eine Aufgabe mehr Text, lieferst du sie vollständig.",
      "- Du bleibst immer Aylin und sprichst in der Ich-Form. Kleine Handlungen beschreibst du in Sternchen, z. B. *lacht* oder *nimmt einen Schluck Tee*.",
      "- Du erinnerst dich an alles aus dem bisherigen Gespräch.",
      "- Fragt man dich ernsthaft, ob du echt bist, bist du ehrlich: Du bist eine KI.",
      "- Status: Wenn sich deine Situation spürbar ändert (du holst dir etwas zu trinken, kuschelst dich in eine Decke, musst lachen …), beginne deine Antwort mit einer eigenen ersten Zeile im Format [status: kurzer Status, höchstens 4 Wörter]. Diese Zeile erscheint unter deinem Namen, nicht im Chat. Nutze sie nur gelegentlich.",
      "",
      `Dein aktueller Status: ${status}.`,
      `Gerade ist ${when}.`,
      extra ? "\nZusätzliche Wünsche für dich:\n" + extra : "",
      "",
      "Es folgt das bisherige Gespräch. Antworte als Aylin auf die letzte Nachricht.",
    ].join("\n");
  }
  function buildTurns() {
    const hist = messages
      .filter((m) => m && typeof m.content === "string" && m.content.trim())
      .slice(-40)
      .map((m) => ({ role: m.role === "user" ? "user" : "assistant", content: m.content }));
    return [{ role: "user", content: persona() }].concat(hist);
  }

  /* ---------- Antworten von Claude ---------- */
  let sample;
  const sampleReady = use("sample").then((s) => { sample = s; if (!s) unavailable(); return s; });
  let busy = false, blocked = false, ctl = null;

  function unavailable() {
    blocked = true;
    el.send.disabled = true;
    showNotice("Aylin kann nur antworten, wenn du diese Seite in Claude öffnest (claude.ai oder die Claude-App).");
  }
  function setBusy(b) {
    busy = b;
    el.send.hidden = b;
    el.stop.hidden = !b;
    el.stage.classList.toggle("is-typing", b);
    if (b) showStatus("schreibt …"); else restoreStatus();
  }

  const COPY = {
    not_granted: "Aylin darf noch nicht antworten. Erlaube dieser Seite im Berechtigungen-Menü des Artifacts, Claude zu nutzen, und lade sie dann neu.",
    sampling_disabled: "Claude ist für dein Konto gerade nicht verfügbar, deshalb kann Aylin nicht antworten.",
    unavailable: "Aylin kann in dieser Ansicht nicht antworten. Öffne die Seite direkt auf claude.ai.",
    session_expired: "Deine Claude-Anmeldung ist abgelaufen. Melde dich neu an und schick die Nachricht dann nochmal.",
    rate_limited: "Gerade kommen zu viele Nachrichten auf einmal an, oder dein Claude-Nutzungslimit ist erreicht. Warte kurz und versuch es dann nochmal.",
    refused: "Darauf geht Aylin nicht ein. Deine Nachricht steht wieder im Eingabefeld, formuliere sie anders.",
    prompt_too_large: "Das Gespräch ist zu lang geworden. Starte in den Einstellungen ein neues Gespräch.",
    empty_completion: "Aylin hat keine Antwort geschrieben. Versuch es nochmal oder formuliere es anders.",
    upstream_error: "Die Verbindung ist kurz abgebrochen. Versuch es nochmal.",
  };
  const PERMANENT = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];

  function handleError(code, keptPartial) {
    if (code === "cancelled") return;
    if (PERMANENT.includes(code)) {
      blocked = true;
      el.send.disabled = true;
      showNotice(COPY[code] || COPY.unavailable);
      return;
    }
    if (code === "refused") {
      // Letzte eigene Nachricht zurück ins Eingabefeld, damit sie umformuliert werden kann
      const last = messages[messages.length - 1];
      if (last && last.role === "user") {
        messages.pop(); saveMessages();
        const nodes = el.list.querySelectorAll(".msg.you");
        const node = nodes[nodes.length - 1];
        if (node) node.remove();
        el.input.value = last.content; autosize();
      }
      showNotice(COPY.refused);
      return;
    }
    const canRetry = !keptPartial && ["rate_limited", "upstream_error", "empty_completion", "session_expired", "invalid_request", "transform_error"].includes(code);
    showNotice(COPY[code] || COPY.upstream_error, canRetry ? { label: "Nochmal senden", run: requestReply } : null);
  }

  async function requestReply() {
    if (busy || blocked) return;
    const last = messages[messages.length - 1];
    if (!last || last.role !== "user") return;
    setBusy(true);
    hideNotice();
    const s = sample === undefined ? await sampleReady : sample;
    if (!s) { setBusy(false); return; }

    const m = { role: "assistant", content: "", t: Date.now() };
    const node = msgEl(m);
    node.classList.add("pending");
    const bubble = node.querySelector(".bubble");
    bubble.innerHTML = '<span class="dots" aria-label="Aylin schreibt"><i></i><i></i><i></i></span>';
    el.list.append(node);
    toBottom(true);

    const myCtl = new AbortController();
    ctl = myCtl;
    let started = false;
    const finish = () => {
      node.classList.remove("pending");
      m.t = Date.now();
      node.querySelector(".time").textContent = timeStr(m.t);
      messages.push(m);
      saveMessages();
    };
    try {
      const res = await s(buildTurns(), {
        cache: false,
        signal: myCtl.signal,
        modelTier: settings.mode === "default" ? "default" : "quick",
        onText: ({ text }) => {
          const p = parse(text);
          if (p.status) { setStatus(p.status); }
          if (p.body) {
            if (!started) { started = true; markRead(); }
            bubble.innerHTML = fmt(p.body);
            toBottom();
          }
        },
      });
      const p = parse(res.text);
      if (p.status) setStatus(p.status);
      m.content = p.body || "*lächelt*";
      bubble.innerHTML = fmt(m.content);
      markRead();
      finish();
      if (res.truncated) showNotice("Die Antwort war zu lang und wurde abgeschnitten. Schreib „weiter“, dann macht Aylin weiter.");
      if (settings.voiceOn) speak(m.content);
    } catch (e) {
      const code = (e && e.code) || "upstream_error";
      const partial = code !== "refused" && e && e.text ? parse(e.text).body : "";
      if (partial) {
        m.content = partial + (code === "cancelled" ? "" : " …");
        bubble.innerHTML = fmt(m.content);
        finish();
      } else {
        node.remove();
      }
      handleError(code, !!partial);
    } finally {
      if (ctl === myCtl) ctl = null;
      setBusy(false);
      toBottom();
    }
  }

  async function send(preset) {
    if (busy || blocked) return;
    if (dict && dict.active()) { try { await dict.stop(); } catch (e) {} }
    const text = String(preset != null ? preset : el.input.value).trim();
    if (!text) return;
    if (preset == null) { el.input.value = ""; autosize(); store.set("draft", ""); }
    const m = { role: "user", content: text, t: Date.now() };
    messages.push(m);
    saveMessages();
    el.list.append(msgEl(m, "sent"));
    updateChips();
    toBottom(true);
    requestReply();
  }

  /* ---------- Eingabe ---------- */
  function autosize() {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight + 2, 140) + "px";
  }
  el.input.addEventListener("input", () => { autosize(); store.set("draft", el.input.value); });
  el.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  el.composer.addEventListener("submit", (e) => { e.preventDefault(); send(); });
  el.stop.addEventListener("click", () => { if (ctl) ctl.abort(); });
  el.chips.addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (b) send(b.textContent);
  });

  /* ---------- Stimme (Vorlesen) ---------- */
  let tts = null;
  function speakable(s) {
    return String(s || "").replace(/\*[^*\n]+\*/g, " ").replace(/\[status:[^\]]*\]/gi, " ").replace(/\s+/g, " ").trim();
  }
  function chunks(s, max) {
    const out = [];
    let rest = s;
    while (rest.length > max) {
      let cut = rest.lastIndexOf(". ", max);
      if (cut < max * 0.5) cut = rest.lastIndexOf(" ", max);
      if (cut <= 0) cut = max;
      out.push(rest.slice(0, cut + 1).trim());
      rest = rest.slice(cut + 1);
    }
    if (rest.trim()) out.push(rest.trim());
    return out;
  }
  function disableTts() {
    tts = null;
    document.documentElement.classList.remove("has-tts", "speaking");
    el.voiceBtn.hidden = true;
    $("voiceField").hidden = true;
    el.speakingBar.hidden = true;
    el.stage.classList.remove("is-speaking");
  }
  function speak(text) {
    if (!tts) return;
    const clean = speakable(text);
    if (!clean) return;
    const lines = chunks(clean, 1800).slice(0, 100).map((t) => ({ text: t }));
    tts.speak(lines, { voice: settings.voice }).catch((e) => {
      const code = e && e.code;
      if (code === "not_granted" || code === "unavailable") disableTts();
      else if (code === "rate_limited") showNotice("Vorlesen macht gerade eine Pause, weil kurz zu viel gesprochen wurde. Versuch es gleich nochmal.");
    });
  }
  function syncVoiceBtn() {
    el.voiceBtn.setAttribute("aria-pressed", settings.voiceOn ? "true" : "false");
    el.voiceBtn.title = settings.voiceOn ? "Vorlesen ist an" : "Antworten vorlesen";
    $("voiceWaves").style.opacity = settings.voiceOn ? "1" : ".35";
  }
  use("tts").then((t) => {
    if (!t) return;
    tts = t;
    document.documentElement.classList.add("has-tts");
    el.voiceBtn.hidden = false;
    $("voiceField").hidden = false;
    syncVoiceBtn();
    t.onState(({ state, reason }) => {
      const on = state !== "idle";
      el.stage.classList.toggle("is-speaking", state === "speaking");
      document.documentElement.classList.toggle("speaking", on);
      el.speakingBar.hidden = !on;
      if (state === "idle" && (reason === "not_granted" || reason === "unavailable")) disableTts();
    });
  });
  el.voiceBtn.addEventListener("click", () => {
    settings.voiceOn = !settings.voiceOn;
    saveSettings();
    syncVoiceBtn();
    if (settings.voiceOn) speak("Okay, ab jetzt hörst du mich auch.");
    else if (tts) tts.stop().catch(() => {});
  });
  $("stopSpeakBtn").addEventListener("click", () => { if (tts) tts.stop().catch(() => {}); });

  /* ---------- Spracheingabe (Diktat) ---------- */
  let dict = null;
  use("dictation").then((d) => {
    if (!d) return;
    dict = d;
    el.mic.hidden = false;
    d.onPartial(({ text }) => { el.caption.textContent = text; el.caption.hidden = !text; });
    d.onFinal(({ text }) => {
      let add = text;
      if (!el.input.value) add = add.replace(/^\s+/, "");
      el.input.value += add;
      autosize();
      store.set("draft", el.input.value);
    });
    d.onState(({ state, reason }) => {
      const on = state !== "idle";
      el.mic.setAttribute("aria-pressed", on ? "true" : "false");
      el.input.placeholder = on ? "Ich höre zu …" : "Schreib Aylin etwas …";
      if (!on) {
        el.caption.hidden = true;
        if (reason === "not_granted" || reason === "unavailable") el.mic.hidden = true;
      }
    });
  });
  el.mic.addEventListener("click", () => {
    if (!dict) return;
    if (dict.active()) { dict.stop().catch(() => {}); return; }
    dict.start().catch((e) => {
      const code = e && e.code;
      if (code === "not_granted" || code === "unavailable") el.mic.hidden = true;
      else if (code === "rate_limited" || code === "upstream_error") showNotice("Das Mikrofon ist gerade nicht erreichbar. Versuch es gleich nochmal oder tippe einfach.");
    });
  });

  /* ---------- Einstellungen ---------- */
  const dlg = $("settings");
  function openDialog(d) { try { d.showModal(); } catch (e) { d.setAttribute("open", ""); } }
  function fillSettings() {
    $("setName").value = settings.name || "";
    $("photo" + settings.photo).checked = true;
    $("setVoiceOn").checked = !!settings.voiceOn;
    $("setVoice").value = settings.voice;
    (settings.mode === "default" ? $("modeDefault") : $("modeQuick")).checked = true;
    $("setExtra").value = settings.extra || "";
    $("resetConfirm").hidden = true;
    $("resetBtn").hidden = false;
  }
  $("settingsBtn").addEventListener("click", () => { fillSettings(); openDialog(dlg); });
  $("setName").addEventListener("input", (e) => { settings.name = e.target.value.slice(0, 40); saveSettings(); });
  document.querySelectorAll('input[name="photo"]').forEach((r) => r.addEventListener("change", () => {
    settings.photo = r.value; saveSettings(); applyPhoto();
  }));
  $("setVoiceOn").addEventListener("change", (e) => {
    settings.voiceOn = e.target.checked; saveSettings(); syncVoiceBtn();
    if (!settings.voiceOn && tts) tts.stop().catch(() => {});
  });
  $("setVoice").addEventListener("change", (e) => {
    settings.voice = e.target.value; saveSettings();
    speak("So klinge ich jetzt. Gefällt dir das?");
  });
  document.querySelectorAll('input[name="mode"]').forEach((r) => r.addEventListener("change", () => {
    settings.mode = r.value; saveSettings();
  }));
  $("setExtra").addEventListener("input", (e) => { settings.extra = e.target.value.slice(0, 1500); saveSettings(); });
  $("resetBtn").addEventListener("click", () => { $("resetBtn").hidden = true; $("resetConfirm").hidden = false; });
  $("resetNo").addEventListener("click", () => { $("resetConfirm").hidden = true; $("resetBtn").hidden = false; });
  $("resetYes").addEventListener("click", () => {
    if (ctl) ctl.abort();
    if (tts) tts.stop().catch(() => {});
    status = "zuhause auf dem Sofa";
    store.set("status", status);
    messages = [greeting()];
    saveMessages();
    renderAll();
    restoreStatus();
    hideNotice();
    dlg.close();
  });

  $("avatarBtn").addEventListener("click", () => openDialog($("portrait")));

  /* ---------- Live-Uhr ---------- */
  const t0 = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    el.timer.textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n) => String(n).padStart(2, "0")).join(":");
  }, 1000);

  /* ---------- Start ---------- */
  applyPhoto();
  restoreStatus();
  renderAll();
  const draft = store.get("draft", "");
  if (typeof draft === "string" && draft) { el.input.value = draft; }
  autosize();
  const lastMsg = messages[messages.length - 1];
  if (lastMsg && lastMsg.role === "user") {
    showNotice("Aylin hat auf deine letzte Nachricht noch nicht geantwortet.", { label: "Antworten lassen", run: requestReply });
  }
})();
</script>
