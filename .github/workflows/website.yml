# Automatische Qualitätsprüfung der Website bei jedem Push / Pull Request,
# der Dateien unter website/ ändert.
name: Website – Tests

on:
  push:
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          tools: composer:v2

      - name: Abhängigkeiten installieren
        run: |
          npm ci
          composer install --working-dir=php --no-interaction --no-progress
          npx playwright install --with-deps chromium

      - name: Typprüfung
        run: npm run check

      - name: PHP-Tests (Formular-Backend)
        run: npm run test:php

      - name: Build
        run: npm run build

      - name: HTML-Validierung
        run: npm run validate:html

      - name: Linkprüfung
        run: npm run check:links

      - name: Browser-Tests (4 Bildschirmbreiten, Barrierefreiheit, SEO, Formular)
        run: npm run test:e2e

      - name: Sicherheitsprüfung der Abhängigkeiten
        run: |
          npm audit --omit=dev --audit-level=high
          composer audit --working-dir=php

      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report
          retention-days: 7
